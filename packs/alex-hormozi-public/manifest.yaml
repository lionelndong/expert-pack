# ── Authority boundary ────────────────────────────────────────────────────────
# What this pack may assert. Consumers must refuse outside it.
authority_boundary:
  in_scope: "Publicly documented Alex Hormozi business frameworks, decision patterns, opinions, and communication style represented by verified source-backed atoms in this pack."
  out_of_scope:
    - "Advice represented as Alex Hormozi's personal, current, or authorized opinion"
    - "Private, paywalled, confidential, or unverified material"
    - "Legal, tax, investment, medical, or other regulated advice"
    - "Claims without a supporting source-backed atom"
  refuse_when:
    - "No supporting atom in the pack"
    - "Question is outside in_scope"
  no_source_no_claim: true

# ── Context strategy ──────────────────────────────────────────────────────────
# Keep person-specific evidence searchable; provenance and volatile content are
# available on demand so they do not crowd decision-agent context.
context:
  always:
    - overview.md
    - STATUS.md
  searchable:
    - mind/
    - opinions/
    - conversations/
    - speeches/
    - workflows/
    - troubleshooting/
    - faq/
  on_demand:
    - meta/
    - volatile/
